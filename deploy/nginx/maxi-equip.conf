# Configuration Nginx — VPS de production MAXI EQUIP.
#
# Installé NATIVEMENT sur le VPS (hors Docker) — jamais containerisé,
# pour une intégration directe et bien documentée avec Certbot
# (`certbot --nginx`), qui réécrit ce fichier lui-même pour ajouter les
# blocs HTTPS/redirection une fois les certificats obtenus. Ce fichier
# contient donc volontairement UNIQUEMENT les blocs HTTP de départ —
# ne pas ajouter les blocs `listen 443 ssl` à la main, laisser Certbot
# les générer (voir procédure ci-dessous).
#
# Installation (sur le VPS, une fois le DNS de maxi-equip.com et
# api.maxi-equip.com pointé vers l'IP du VPS) :
#   1. sudo cp deploy/nginx/maxi-equip.conf /etc/nginx/sites-available/maxi-equip.conf
#   2. sudo ln -s /etc/nginx/sites-available/maxi-equip.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d maxi-equip.com -d www.maxi-equip.com -d api.maxi-equip.com
#      (Certbot modifie ce fichier pour ajouter HTTPS + la redirection
#      HTTP→HTTPS automatiquement — ne pas le faire à la main avant.)
#
# `api`/`site` tournent dans Docker, exposés UNIQUEMENT sur
# 127.0.0.1 (voir deploy/docker-compose.yml) — jamais atteignables
# directement depuis Internet, uniquement via ce reverse proxy.

server {
    listen 80;
    listen [::]:80;
    server_name maxi-equip.com www.maxi-equip.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.maxi-equip.com;

    # Les images catalogue peuvent être volumineuses (voir
    # core/validationCatalogueSync.ts, TAILLE_MAX_IMAGE_OCTETS = 8 Mo
    # décodés — le corps encodé en base64 JSON est plus volumineux
    # encore) — sans cette limite explicite, Nginx rejette la requête
    # avant même qu'elle n'atteigne l'API.
    client_max_body_size 15m;

    # Système multiposte fiable (2026-10-28), Phase F — flux SSE (Server-
    # Sent Events) de synchronisation quasi instantanée (voir
    # core/httpAdapter.ts, /v1/app/sync/stream). Connexion longue durée,
    # contrairement à toutes les autres routes ci-dessous (requête/
    # réponse classique) : SANS ces deux directives, Nginx mettrait en
    # tampon la réponse (retardant chaque évènement de plusieurs
    # secondes, voire indéfiniment) et couperait la connexion après le
    # délai d'inactivité par défaut (bien avant le battement de cœur de
    # 25s envoyé par le serveur, voir httpAdapter.ts/INTERVALLE_BATTEMENT_MS).
    location /v1/app/sync/stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

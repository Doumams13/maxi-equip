<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>MAXI EQUIP</title>
    <style>
      /*
        Remise à zéro CSS minimale (Phase 1, correction du débordement de
        l'écran de connexion) : sans elle, la marge par défaut du
        navigateur sur <body> (8px) fait déborder tout élément dimensionné
        en 100vh/100vw. La marge est supprimée à la source.

        IMPORTANT — évolution suite à un retour utilisateur : un premier
        correctif mettait `overflow: hidden` sur html/body, ce qui
        empêchait TOUT défilement dans l'application, pas seulement sur
        l'écran de connexion. Or seul l'écran de connexion doit rester
        sans défilement (son contenu est conçu pour toujours tenir) —
        les autres écrans (tableau de bord, puis futurs écrans métier)
        doivent, eux, pouvoir défiler normalement quand leur contenu
        dépasse la fenêtre. Le défilement est donc désormais autorisé au
        niveau de <body> (overflow-y: auto), et c'est l'écran de connexion
        lui-même qui empêche son propre défilement localement (voir
        LoginScreen.tsx : hauteur 100% + overflow hidden sur son propre
        conteneur), pas une règle globale qui bloquerait tout le reste.
      */
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }
      #root {
        min-height: 100%;
        width: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

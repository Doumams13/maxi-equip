<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Aucune balise <meta> Content-Security-Policy ici, volontairement.
      Le processus Main applique déjà une CSP complète et à jour via
      en-tête HTTP (voir main/security/windowOptions.ts +
      applyContentSecurityPolicy() dans main/index.ts), qui couvre TOUTES
      les requêtes du Renderer, y compris le chargement de ce fichier.

      Une ancienne balise <meta> CSP de la Phase 1 (sans img-src) a
      auparavant coexisté avec cette CSP du Main : le navigateur applique
      alors l'INTERSECTION des deux, et la balise <meta>, plus stricte,
      bloquait silencieusement les images en data: — c'est la cause
      exacte du bug "images sélectionnées mais affichées comme cassées"
      (icône de navigateur + texte alternatif visible, mais pixels
      absents). Une seule source de vérité pour la CSP évite que ce
      problème ne se reproduise à la prochaine évolution de la politique.
    -->
    <title>MAXI EQUIP</title>
    <style>
      /*
        Remise à zéro CSS minimale (Phase 1, correction du débordement de
        l'écran de connexion) : sans elle, la marge par défaut du
        navigateur sur <body> (8px) fait déborder tout élément dimensionné
        en 100vh/100vw. La marge est supprimée à la source.

        Le défilement est autorisé au niveau de <body> (overflow-y: auto)
        — nécessaire pour les écrans dont le contenu dépasse la fenêtre
        (tableau de bord, futurs écrans métier) — et c'est l'écran de
        connexion lui-même qui empêche son propre défilement localement
        (voir LoginScreen.tsx : hauteur 100% + overflow hidden sur son
        propre conteneur), pas une règle globale.

        IMPORTANT — `height: 100%` (pas `min-height`) sur body/#root :
        une deuxième correction a été nécessaire ici. `min-height: 100%`
        semblait équivalent, mais en CSS, un enfant avec `height: 100%`
        (comme le conteneur racine de LoginScreen) ne peut résoudre son
        pourcentage QUE si son parent a une hauteur définie (`height`),
        pas seulement une hauteur minimale (`min-height`, qui n'est pas
        considérée comme "définie" pour cette résolution). Avec
        `min-height`, LoginScreen se réduisait à la taille de son contenu
        au lieu de remplir la fenêtre, laissant un espace vide en bas
        dès que la fenêtre était plus grande que son contenu (ex. après
        agrandissement). `height: 100%` reste compatible avec le
        défilement : `overflow-y: auto` ne s'active que si le contenu
        dépasse effectivement cette hauteur, sans empêcher un contenu
        plus long (tableau de bord) de rester défilable.
      */
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
